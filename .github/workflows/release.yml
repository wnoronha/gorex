name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go tool mygo build -platform darwin/universal,linux/amd64,windows/amd64
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: build/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: build
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: build/**
